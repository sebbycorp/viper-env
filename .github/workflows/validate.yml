# Renders every kustomize root and every pinned Helm chart with this repo's
# values. Public registries only — no secrets in this workflow.
name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    name: render manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install helm and kustomize
        run: |
          set -euo pipefail
          curl -sSfL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
          python3 -c 'import yaml'

      - name: Render
        run: ./scripts/validate.sh
