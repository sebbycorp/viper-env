# Generated by tdlib/manifests.py render_dimensions_values(); test_manifests keeps it in sync.
# Applied by `td.py up` with `helm upgrade --reuse-values -f`; `td.py down` restores the original.
budgetDimensions:
  enabled: true
  config:
    hierarchy:
    - {id: organization, displayName: Organization, expression: apiKey.organization}
    - {id: group, displayName: Group, expression: 'coalesce(jwt.group, apiKey.group)'}
    - {id: team, displayName: Team, expression: apiKey.custom.team}
    - id: user
      displayName: User
      expression: 'coalesce(apiKey.user, apiKey.name, apiKey.owner, jwt.sub, jwt.email, basicAuth.username, source.identity.namespace + "/" + source.identity.serviceAccount, source.subjectCn)'
    attributes:
    - {id: virtualKey, displayName: Virtual Key, expression: apiKey.id}
    - {id: project, displayName: Project, expression: apiKey.custom.project}
    - id: client
      displayName: Client Tool
      expression: 'request.headers["user-agent"].contains("sdk-cli") ? "Claude Code (CI)" : request.headers["user-agent"].startsWith("claude-cli") ? "Claude Code" : request.headers["user-agent"].startsWith("GitHubCopilot") ? "GitHub Copilot" : request.headers["user-agent"].contains("Claude Desktop") ? "Claude Desktop" : (request.headers["user-agent"].startsWith("Continue/") || request.headers["user-agent"].startsWith("Cline/")) ? "VS Code" : "Other"'
