apiVersion: v1
kind: ServiceAccount
metadata: {name: homelab-router, namespace: tailscale}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: homelab-router, namespace: tailscale}
rules:
# containerboot creates its state secret on first run; create cannot be limited by resourceNames
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [tailscale-state]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [events]
  verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: homelab-router, namespace: tailscale}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: homelab-router}
subjects:
- {kind: ServiceAccount, name: homelab-router, namespace: tailscale}
