# Model provider keys.
#   vault kv put secret/lab/viper/models \
#     openai_authorization='<OpenAI API key>' spark_api_key='<vLLM key or any non-empty string>'
# openai-secret: agentgateway injects it (AgentgatewayBackend policies.auth.secretRef).
# kagent-spark-openai: kagent default ModelConfig + codex ModelConfig.
# bedrock-secret is defined next to its backend in config/agentgateway-system.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-secret
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-lab}
  target: {name: openai-secret, creationPolicy: Owner}
  data:
    - secretKey: Authorization
      remoteRef: {key: lab/viper/models, property: openai_authorization}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-spark-openai
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-lab}
  target: {name: kagent-spark-openai, creationPolicy: Owner}
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef: {key: lab/viper/models, property: spark_api_key}
