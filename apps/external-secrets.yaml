# Installs External Secrets Operator via the official Helm chart.
# Vault CRs are a separate Application (external-secrets-config) so they
# apply after CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: viper-env
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 1
        serviceAccount:
          name: external-secrets
        crds:
          createClusterSecretStore: true
          createSecretStore: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
