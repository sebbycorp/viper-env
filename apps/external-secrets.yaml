# Installs External Secrets Operator via the official Helm chart, then syncs
# the in-repo ClusterSecretStore + demo ExternalSecret (after CRDs exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: viper-oss-env
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.9.0
      helm:
        releaseName: external-secrets
        valuesObject:
          installCRDs: true
          replicaCount: 1
          crds:
            createClusterSecretStore: true
            createSecretStore: true
    - repoURL: https://github.com/sebbycorp/viper-oss-env.git
      targetRevision: HEAD
      path: apps/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
