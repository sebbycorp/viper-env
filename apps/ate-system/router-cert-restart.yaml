# Workaround: atenet-router (agentgateway v0.0.0-alpha.168b05d6) loads its 24h
# kubelet PodCertificates (servicedns/podidentity.podcert.ate.dev) at startup and
# never reloads them. Kubelet rotates the files, but once the in-memory cert
# expires every ResumeActor to ate-api-server fails with
# "received fatal alert: CertificateExpired" and no agent can start a session.
# Restart the router every 12h so it always holds a valid cert. Drop this once
# the router hot-reloads pod certificates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-router-restarter
  namespace: ate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atenet-router-restarter
  namespace: ate-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["atenet-router"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atenet-router-restarter
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atenet-router-restarter
subjects:
  - kind: ServiceAccount
    name: atenet-router-restarter
    namespace: ate-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atenet-router-cert-restart
  namespace: ate-system
spec:
  schedule: "0 */12 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: atenet-router-restarter
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.2
              command:
                - kubectl
                - -n
                - ate-system
              args:
                - rollout
                - restart
                - deployment/atenet-router
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
