apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: desk, namespace: remarkable-diary}
spec:
  parentRefs:
  - {group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway-proxy, namespace: agentgateway-system}
  rules:
  - matches: [{path: {type: PathPrefix, value: /desk}}]
    filters:
    - type: URLRewrite
      urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
    backendRefs:
    - {group: "", kind: Service, name: agent-desk, port: 8080, weight: 1}
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: {name: desk-apikey, namespace: remarkable-diary}
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: desk}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      location:
        header: {name: Authorization, prefix: "Bearer "}
      secretRef: {name: desk-apikeys}
