    import re
    from dataclasses import dataclass
    from typing import Optional

    AGENTS = {"forti": "table", "k8s": "auto"}          # default format per agent
    FORMATS = {"table", "stats", "json", "text", "markmap"}
    _ALIASES = {"fortigate": "forti", "forti": "forti", "kubernetes": "k8s", "kube": "k8s", "k8s": "k8s"}
    _TAG = re.compile(r"^\s*@\s*([A-Za-z0-9][\w-]*)\s*:?\s*", re.IGNORECASE)
    _FMT = re.compile(r"^(table|stats|json|text|markmap|mindmap|map)\s*:\s*", re.IGNORECASE)

    @dataclass
    class ParsedAsk:
        agent: Optional[str]          # "forti" | "k8s" | None (unknown tag)
        fmt: str
        query: str
        unknown: Optional[str] = None # the tag as written, when not a known agent

    def parse_ask(text: str) -> Optional[ParsedAsk]:
        m = _TAG.match(text or "")
        if not m:
            return None
        tag = m.group(1).lower()
        rest = text[m.end():].strip()
        agent = _ALIASES.get(tag)
        if agent is None:
            return ParsedAsk(agent=None, fmt="text", query=rest, unknown=tag)
        fmt = AGENTS[agent]
        f = _FMT.match(rest)
        if f:
            word = f.group(1).lower()
            fmt = "markmap" if word in ("markmap", "mindmap", "map") else word
            rest = rest[f.end():].strip()
        return ParsedAsk(agent=agent, fmt=fmt, query=rest)
