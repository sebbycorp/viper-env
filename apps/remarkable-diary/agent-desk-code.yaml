    # server.py — /ask router: @k8s / @forti -> Agent Substrate AgentTemplates -> render-spec.
    import asyncio, os, time
    import httpx
    from fastapi import FastAPI
    from pydantic import BaseModel
    from parse import parse_ask
    from renderspec import error_spec, safe_spec
    import llm
    from substrate import SubstrateClient

    def _pairs(s): return dict(p.split("=", 1) for p in s.split(",") if "=" in p)
    TEMPLATES = _pairs(os.environ.get("AGENT_TEMPLATES", "k8s=k8s-assistant,forti=fortigate"))
    NAMES = {"k8s": "k8s", "forti": "fortigate"}
    AGENT_TIMEOUT = 90.0            # wall-clock bound per agent call (httpx timeouts are per read)
    SESSION_TTL = float(os.environ.get("SESSION_TTL", "900"))
    _client = SubstrateClient(os.environ.get("SUBSTRATE_URL", "http://kagent-controller.kagent.svc:8085"),
                              cluster=os.environ.get("SUBSTRATE_CLUSTER", "omni-viper"))
    substrate_ask = _client.ask          # patched in tests

    async def coerce(text, fmt, query=""):   # patched in tests (may be sync there)
        return await llm.coerce_async(text, fmt, query)

    _SESSIONS: dict = {}                 # agent -> (session, last_ts)
    _LOCKS: dict = {}                    # agent -> (loop, asyncio.Lock) (an instance runs one task at a time)

    def _lock(agent):
        loop = asyncio.get_running_loop()
        cur = _LOCKS.get(agent)
        if cur is None or cur[0] is not loop:      # asyncio.Lock binds to a loop (py3.9)
            cur = _LOCKS[agent] = (loop, asyncio.Lock())
        return cur[1]

    def _text(t):
        return {"kind": "text", "title": "", "columns": [], "rows": [], "tiles": [], "text": t, "md": "", "note": ""}

    async def _call(agent, query):
        sess, ts = _SESSIONS.get(agent, ("", 0))
        if time.time() - ts > SESSION_TTL: sess = ""
        try:
            ans, new = await asyncio.wait_for(
                substrate_ask(TEMPLATES[agent], query, timeout=AGENT_TIMEOUT, session=sess), AGENT_TIMEOUT)
        except (httpx.TimeoutException, asyncio.TimeoutError):
            raise
        except Exception:
            if not sess: raise
            # broken/stale instance: replace it once with a fresh one
            ans, new = await asyncio.wait_for(
                substrate_ask(TEMPLATES[agent], query, timeout=AGENT_TIMEOUT, session=""), AGENT_TIMEOUT)
        _SESSIONS[agent] = (new, time.time())
        return ans

    async def handle(text):
        p = parse_ask(text)
        if p is None: return _text("Start with @k8s or @forti to ask an agent.")
        if p.agent is None: return _text(f"No @{p.unknown} agent on this cluster.")
        name = NAMES[p.agent]
        async with _lock(p.agent):
            try:
                ans = await _call(p.agent, p.query)
            except (httpx.TimeoutException, asyncio.TimeoutError):
                return error_spec(name, "took too long")
            except Exception:
                return error_spec(name, "returned an error")
        if not ans: return error_spec(name, "returned nothing")
        try:
            r = coerce(ans, p.fmt, p.query)
            spec = await r if asyncio.iscoroutine(r) else r
        except Exception:
            spec = None
        return safe_spec(spec, p.fmt) if spec else safe_spec({"kind": "text", "text": ans}, "text")

    class Ask(BaseModel):
        text: str = ""

    app = FastAPI()

    @app.post("/ask")
    async def ask(a: Ask): return await handle(a.text)

    @app.post("/ping")
    async def ping(): return {"ok": True}

    @app.get("/healthz")
    async def healthz(): return {"ok": True}
