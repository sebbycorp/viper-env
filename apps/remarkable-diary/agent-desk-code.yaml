    # substrate.py — client for kagent Enterprise 1.0.0-alpha10 Agents (api.kagent.dev/v1alpha3) on Agent Substrate.
    # alpha10 removed the alpha3 AgentInstanceService (CreateAgentInstance + x-kagent-agent-instance-id). An Agent
    # now pairs its own Harness, and callers talk to it over A2A JSON-RPC at the controller gateway:
    #   token:   POST {token_base}/autoauth/token  {"user_type": "admin"}   (bundled IdP; controller :8085)
    #   message: POST {gateway}/agents/{ns}/{agent}  JSON-RPC "SendMessage", header A2A-Version: 1.0  (controller :8083)
    # The returned task.contextId is the Session id: pass it back on the next message to continue the conversation.
    import time, uuid
    import httpx

    class Unauthorized(Exception):
        pass

    def build_send_req(text: str, context_id: str = "", message_id: str = "") -> dict:
        msg = {"messageId": message_id or uuid.uuid4().hex, "role": "ROLE_USER", "parts": [{"text": text}]}
        if context_id: msg["contextId"] = context_id
        return {"jsonrpc": "2.0", "id": uuid.uuid4().hex, "method": "SendMessage", "params": {"message": msg}}

    def _texts(parts):
        return "".join(p["text"] for p in parts or [] if isinstance(p, dict) and isinstance(p.get("text"), str))

    def parse_result(body: dict):
        """SendMessage JSON-RPC response -> (answer, context_id). Raises RuntimeError on JSON-RPC/task errors."""
        if body.get("error"):
            e = body["error"]; raise RuntimeError(f"a2a {e.get('code')}: {e.get('message')}")
        res = body.get("result") or {}
        if "task" in res:
            task = res["task"]; state = (task.get("status") or {}).get("state", "")
            status_txt = _texts(((task.get("status") or {}).get("message") or {}).get("parts"))
            if state in ("TASK_STATE_FAILED", "TASK_STATE_REJECTED", "TASK_STATE_CANCELED"):
                raise RuntimeError(f"task {state}: {status_txt}")
            # Final answer = the last text artifact (earlier artifacts are tool calls / tool results).
            ans = ""
            for art in task.get("artifacts") or []:
                t = _texts(art.get("parts"))
                if t.strip(): ans = t
            return (ans or status_txt).strip(), task.get("contextId", "")
        if "message" in res:                                  # direct Message reply (no task)
            m = res["message"]; return _texts(m.get("parts")).strip(), m.get("contextId", "")
        raise RuntimeError("a2a: empty result")


    class SubstrateClient:
        """token_base: controller enterprise port (:8085, serves /autoauth/token).
        gateway: controller A2A gateway (:8083, serves /agents/{ns}/{name})."""
        def __init__(self, token_base, gateway="http://kagent-controller.kagent.svc:8083", ns="kagent", **_ignored):
            self.token_base = token_base.rstrip("/"); self.gateway = gateway.rstrip("/"); self.ns = ns
            self._tok = None; self._tok_ts = 0.0

        async def _token(self, c, force=False):
            if self._tok and not force and time.time() - self._tok_ts < 3600: return self._tok
            r = await c.post(self.token_base + "/autoauth/token", json={"user_type": "admin"})
            r.raise_for_status(); self._tok = r.json()["access_token"]; self._tok_ts = time.time()
            return self._tok

        async def _send(self, c, agent, req):
            h = {"Authorization": "Bearer " + await self._token(c), "content-type": "application/json",
                 "A2A-Version": "1.0"}
            r = await c.post(f"{self.gateway}/agents/{self.ns}/{agent}", json=req, headers=h)
            if r.status_code == 401: raise Unauthorized()
            r.raise_for_status()
            return r.json()

        async def ask(self, agent, text, *, timeout=90.0, session=""):
            """Returns (answer, session). session = the A2A contextId; pass it back for follow-ups."""
            agent = agent.partition("@")[0]                 # tolerate old "name@harness" entries
            req = build_send_req(text, session)
            async with httpx.AsyncClient(timeout=timeout) as c:
                try:
                    body = await self._send(c, agent, req)
                except Unauthorized:                        # expired token: refresh once
                    await self._token(c, force=True)
                    body = await self._send(c, agent, req)
            ans, ctx = parse_result(body)
            return ans, ctx or session
