    # renderspec.py — the render-spec schema, the coercion prompt, and safe fallbacks.

    SCHEMA = {
        "name": "render_spec",
        "strict": True,
        "schema": {
            "type": "object",
            "additionalProperties": False,
            "required": ["kind", "title", "columns", "rows", "tiles", "text", "md", "note"],
            "properties": {
                "kind": {"type": "string", "enum": ["table", "stats", "json", "text", "markmap"]},
                "title": {"type": "string"},
                "columns": {"type": "array", "items": {"type": "string"}},
                "rows": {"type": "array", "items": {"type": "array", "items": {"type": "string"}}},
                "tiles": {"type": "array", "items": {
                    "type": "object", "additionalProperties": False,
                    "required": ["label", "value"],
                    "properties": {"label": {"type": "string"}, "value": {"type": "string"}}}},
                "text": {"type": "string"},
                "md": {"type": "string"},
                "note": {"type": "string"},
            },
        },
    }

    _SYS = (
        "You convert an infrastructure agent's answer into a compact render-spec for a "
        "small e-ink tablet. Return ONLY an object matching the schema. Rules:\n"
        "- kind=table: fill columns + rows (rows are arrays of short strings, same length as columns). "
        "Keep to <=6 columns and <=15 rows; abbreviate long values.\n"
        "- kind=stats: fill tiles (label + short value), <=8 tiles. Good for health/counters.\n"
        "- kind=json: put a compact pretty-printed JSON string in text.\n"
        "- kind=text: put a short prose answer in text (<=6 lines).\n"
        "- kind=markmap: put a markdown OUTLINE in md — one # root, nested ## / - bullets, "
        "3-4 levels, short labels. Good for mind maps, hierarchies, or 'map out X'.\n"
        "Always set title (<=40 chars) and note (data source, <=40 chars). "
        "Leave unused fields as empty arrays/strings."
    )

    def coercion_messages(fmt: str, query: str, agent_payload: str):
        if fmt == "markmap":
            pref = ("Format: markmap — return kind=markmap with a markdown outline in md "
                    "(# root, nested ## / - bullets). Use it to map out the answer as a hierarchy.")
        elif fmt == "auto":
            pref = ("No fixed format — pick the best of table/stats/json/text/markmap for this data "
                    "(lists of resources -> table; health/counters -> stats; a hierarchy or "
                    "'map out' -> markmap; diagnoses -> text).")
        else:
            pref = (f"Preferred format: {fmt}. If the data does not fit that format, pick the best of "
                    f"table/stats/json/text/markmap.")
        user = f"{pref}\nUser question: {query}\n\nAgent output:\n{agent_payload}"
        return [{"role": "system", "content": _SYS}, {"role": "user", "content": user}]

    _EMPTY = {"kind": "text", "title": "", "columns": [], "rows": [], "tiles": [], "text": "", "md": "", "note": ""}

    def _base():
        return dict(_EMPTY)

    def safe_spec(obj, fmt: str):
        """Never raise. Return a valid render-spec, degrading to text on anything odd."""
        if not isinstance(obj, dict):
            s = _base(); s["text"] = str(obj); return s
        kind = obj.get("kind")
        if kind not in ("table", "stats", "json", "text", "markmap"):
            s = _base(); s["text"] = obj.get("text") or str(obj); s["title"] = str(obj.get("title", "")); return s
        s = _base()
        s["kind"] = kind
        s["title"] = str(obj.get("title", ""))
        s["note"] = str(obj.get("note", ""))
        if kind == "markmap":
            s["md"] = str(obj.get("md", ""))
            if not s["md"].strip():          # empty outline -> degrade to prose
                s["kind"] = "text"; s["text"] = str(obj.get("text", ""))
        elif kind == "table":
            cols = obj.get("columns")
            s["columns"] = [str(c) for c in cols] if isinstance(cols, list) else []
            rows = obj.get("rows")
            s["rows"] = ([[str(c) for c in row] for row in rows if isinstance(row, list)]
                         if isinstance(rows, list) else [])
        elif kind == "stats":
            tiles = obj.get("tiles")
            s["tiles"] = ([{"label": str(t.get("label", "")), "value": str(t.get("value", ""))}
                           for t in tiles if isinstance(t, dict)]
                          if isinstance(tiles, list) else [])
        else:  # json | text
            s["text"] = str(obj.get("text", ""))
        return s

    def error_spec(agent: str, msg: str):
        s = _base()
        s["title"] = f"{agent} agent"
        s["text"] = f"The {agent} agent {msg}."
        return s
