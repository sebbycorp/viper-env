# kagent Enterprise CRDs (api.kagent.dev/v1alpha3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: kagent-crds
    app.kubernetes.io/part-of: viper-env
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: us-docker.pkg.dev/solo-public/kagent-enterprise-helm/charts
      chart: kagent-enterprise-crds
      targetRevision: 1.0.0-alpha12
      helm:
        releaseName: kagent-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      # Never prune CRDs: deleting one deletes every custom resource of that kind.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
