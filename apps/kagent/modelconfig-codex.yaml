# gpt-5.4 for the Codex harness, via the in-cluster agentgateway over plain
# HTTP (Substrate's beta4 egress breaks direct HTTPS to api.openai.com). The
# gateway injects the real OpenAI key from openai-secret, so the API key here
# is the same placeholder Spark uses.
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: codex-gpt-5-4
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: viper-env
spec:
  provider: OpenAI
  model: gpt-5.4
  apiKeySecret: kagent-spark-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    apiFormat: responses
    baseUrl: http://agentgateway-proxy.agentgateway-system.svc.cluster.local:8080/openai/v1
