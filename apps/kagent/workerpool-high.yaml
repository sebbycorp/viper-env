# Reserved capacity for high-priority agents: low-tier (kagent-default)
# traffic can never occupy these workers. Same Substrate Enterprise worker image
# as the Helm-owned pool (substrateWorkerPool.workerImage in values/kagent-enterprise.yaml).
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: kagent-high
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: viper-env
    kagent.dev/worker-pool-name: kagent-high
    kagent.dev/worker-pool-namespace: kagent
    substrate.viper-env/tier: high
spec:
  replicas: 2
  sandboxClass: gvisor
  workerImage: us-docker.pkg.dev/solo-public/substrate-enterprise/ateom-gvisor:v0.5.0-alpha3-e492046
  template:
    serviceAccountName: kagent-default
    priorityClassName: substrate-high
    labels:
      substrate.viper-env/tier: high
