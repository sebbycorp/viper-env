# kagent UI on the LAN: http://172.16.10.178:30500 (HTTPS :30501 is the nginx
# kagent-ui-tls front). The chart can only switch the Service type, so pin it here.
apiVersion: v1
kind: Service
metadata:
  name: kagent-ui-nodeport
  namespace: kagent
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kagent-enterprise
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/component: ui
  ports:
    - name: ui
      port: 8080
      targetPort: 8080
      nodePort: 30500
