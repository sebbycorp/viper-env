# Dedicated workers for coding sessions (Codex harness), so long coding turns
# never hold the shared kagent-default workers. Two+ workers: a Harness image
# change prepares the new golden snapshot while the old revision still holds one.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: kagent-coding
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: viper-env
    kagent.dev/worker-pool-name: kagent-coding
    kagent.dev/worker-pool-namespace: kagent
    substrate.viper-env/tier: coding
spec:
  replicas: 3
  sandboxClass: gvisor
  workerImage: us-docker.pkg.dev/solo-public/substrate-enterprise/ateom-gvisor:v0.5.0-alpha3-e492046
  template:
    serviceAccountName: kagent-default
    labels:
      substrate.viper-env/tier: coding
