# Runtime image: the release built-in (controller config.harnessImages), so no workload.image here.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: coding
  namespace: kagent
  labels:
    app.kubernetes.io/name: coding-harness
    app.kubernetes.io/part-of: viper-env
spec:
  codex: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/coding
    workerPoolRef:
      name: kagent-coding
