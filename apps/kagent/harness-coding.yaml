# Codex runtime adapter, pinned to 1.0.0-alpha3 to match the kagent Enterprise
# 1.0.0-alpha3 controller. Older adapter builds (e.g. 0.0.0-alpha.g96d16dfb5f39,
# the golang-adk build the default Harness runs) reject the controller's config
# with `json: unknown field "runtime_telemetry"` and never pass readyz.
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: coding
  namespace: kagent
  labels:
    app.kubernetes.io/name: coding-harness
    app.kubernetes.io/part-of: viper-env
spec:
  allowedAgentTemplates:
    selector:
      matchLabels:
        kagent.dev/harness: coding
  codex: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/coding
    workerPoolRef:
      name: kagent-coding
  workload:
    image: ghcr.io/kagent-dev/kagent/codex-harness@sha256:6cc547df962c9fdfe92c57089fb549083de1b5fefdb4cb1d1108de9167957d37
