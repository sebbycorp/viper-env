# Codex runtime adapter, pinned to OSS 1.0.0-alpha13: the runtime contract that ships with kagent Enterprise
# 1.0.0-alpha10 (OSS alpha10-12 runtimes still require KAGENT_API_URL and crash).
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: coding
  namespace: kagent
  labels:
    app.kubernetes.io/name: coding-harness
    app.kubernetes.io/part-of: viper-env
spec:
  codex: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/coding
    workerPoolRef:
      name: kagent-coding
  workload:
    image: ghcr.io/kagent-dev/kagent/codex-harness:1.0.0-alpha13@sha256:04788e85c9e1ef98b3f568b9aa749a5e16d2250d115449332dba98baa26305fa
