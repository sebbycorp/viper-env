# Codex runtime adapter, pinned to OSS 1.0.0-alpha17: the runtime that ships with kagent Enterprise
# 1.0.0-alpha12 (release-manifest.json). OSS alpha10-12 runtimes require KAGENT_API_URL and crash.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: coding
  namespace: kagent
  labels:
    app.kubernetes.io/name: coding-harness
    app.kubernetes.io/part-of: viper-env
spec:
  codex: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/coding
    workerPoolRef:
      name: kagent-coding
  workload:
    image: ghcr.io/kagent-dev/kagent/codex-harness:1.0.0-alpha17@sha256:1c8565efce78c420b6726c68eaf010363fafd4eeec0c1afcd317d9e517434c22
