# Default (low) tier: kagent native runtime on the Helm-owned kagent-default pool.
# Runtime: OSS golang-adk 1.0.0-alpha13 = the contract kagent Enterprise 1.0.0-alpha10 ships with
# (OSS alpha10-12 runtimes still require KAGENT_API_URL and crash before the golden snapshot).
# kagent 1.0.0-alpha10 dropped Harness.spec.allowedAgentTemplates: an Agent now
# pairs one Harness with one AgentTemplate explicitly (spec.harnessRef).
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: default
  namespace: kagent
  labels:
    app.kubernetes.io/name: default-harness
    app.kubernetes.io/part-of: viper-env
spec:
  kagent: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/default
    workerPoolRef:
      name: kagent-default
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk:1.0.0-alpha13@sha256:ae01c3a6d7e0ed2e044253a26abbfb1a9426f3176363842ca9a954762c274d36
