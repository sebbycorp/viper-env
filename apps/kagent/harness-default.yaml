# Default (low) tier: kagent native runtime on the Helm-owned kagent-default pool.
# An Agent pairs one Harness with one AgentTemplate explicitly (spec.harnessRef).
# Runtime image: the release built-in (controller config.harnessImages), so no workload.image here.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: default
  namespace: kagent
  labels:
    app.kubernetes.io/name: default-harness
    app.kubernetes.io/part-of: viper-env
spec:
  kagent: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/default
    workerPoolRef:
      name: kagent-default
