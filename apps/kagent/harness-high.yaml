# High tier: kagent native runtime on the reserved kagent-high pool.
# Mirrors the default Harness apart from pool/snapshots.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: high
  namespace: kagent
  labels:
    app.kubernetes.io/name: high-harness
    app.kubernetes.io/part-of: viper-env
spec:
  kagent: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/high
    workerPoolRef:
      name: kagent-high
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk:1.0.0-alpha10@sha256:643e2ad56def5182616e24a420a8e823ce4c7d89e776b8ead72ee16cef3d0937
