# High tier: kagent native runtime on the reserved kagent-high pool.
# Mirrors the default Harness apart from pool/snapshots.
# Runtime image: the release built-in (controller config.harnessImages), so no workload.image here.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: high
  namespace: kagent
  labels:
    app.kubernetes.io/name: high-harness
    app.kubernetes.io/part-of: viper-env
spec:
  kagent: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/high
    workerPoolRef:
      name: kagent-high
