# High tier: kagent native runtime on the reserved kagent-high pool.
# Runtime: OSS golang-adk 1.0.0-alpha17 = the runtime kagent Enterprise 1.0.0-alpha12 ships with
# (OSS alpha10-12 runtimes still require KAGENT_API_URL and crash before the golden snapshot).
# Mirrors the default Harness apart from pool/snapshots.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: high
  namespace: kagent
  labels:
    app.kubernetes.io/name: high-harness
    app.kubernetes.io/part-of: viper-env
spec:
  kagent: {}
  substrate:
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/high
    workerPoolRef:
      name: kagent-high
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk:1.0.0-alpha17@sha256:d20d411759d7bb549f00b7d6e8d669b91694aeb57dce847dcd2cbb68aa0d45f3
