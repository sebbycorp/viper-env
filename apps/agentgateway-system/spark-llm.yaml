# DGX Spark (vLLM, OpenAI-compatible) via the kagent selectorless Service.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: spark-qwen
  namespace: agentgateway-system
spec:
  ai:
    provider:
      host: dgx-spark.kagent.svc.cluster.local
      port: 8000
      openai:
        model: unsloth/Qwen3.8-27B-NVFP4
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spark-qwen
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /spark
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: spark-qwen
          group: agentgateway.dev
          kind: AgentgatewayBackend
