# Solo Enterprise UI on the LAN: http://172.16.10.178:30400. The management
# chart cannot pin a nodePort, so its Service stays ClusterIP and this one is pinned.
apiVersion: v1
kind: Service
metadata:
  name: solo-enterprise-ui-nodeport
  namespace: agentgateway-system
spec:
  type: NodePort
  selector:
    app: solo-enterprise-ui
  ports:
    - name: http
      port: 80
      targetPort: 8090
      nodePort: 30400
