# Bedrock model on the dedicated bedrock-proxy (NodePort 30801), pinned so it works in
# the Solo UI playground. Model and region mirror Vault secret/lab/bedrock
# (BEDROCK_MODEL_ID, BEDROCK_REGION); keep them in sync when that changes.
# Auth: Bedrock API key from Vault lab/bedrock BEDROCK_API_KEY, synced by ESO into
# Secret bedrock-secret (key: Authorization).
# RuntimeOnly = Bedrock runtime (Converse) API rather than the Mantle endpoint.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: bedrock-secret, namespace: agentgateway-system}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-lab}
  target: {name: bedrock-secret, creationPolicy: Owner}
  data:
  - secretKey: Authorization
    remoteRef: {key: lab/bedrock, property: BEDROCK_API_KEY}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: bedrock-claude-haiku-4-5
  namespace: agentgateway-system
spec:
  ai:
    provider:
      bedrock:
        region: us-east-2
        model: us.anthropic.claude-haiku-4-5-20251001-v1:0
        endpointPreference: RuntimeOnly
  policies:
    auth:
      secretRef:
        name: bedrock-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bedrock-claude-haiku-4-5
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: bedrock-proxy
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /claude-haiku-4-5
      backendRefs:
        - name: bedrock-claude-haiku-4-5
          group: agentgateway.dev
          kind: AgentgatewayBackend
          weight: 1
