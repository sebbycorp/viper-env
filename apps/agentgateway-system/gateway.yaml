# Enterprise agentgateway data plane: one proxy, exposed on NodePort 30800.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayParameters
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  service:
    spec:
      type: NodePort
      ports:
        - name: http
          port: 8080
          nodePort: 30800
  # Pricing for llm.cost / Cost Management (see model-costs.yaml).
  modelCatalog:
    sources:
      - configMap:
          name: model-costs
          key: catalog.json
  # Node is CPU-request bound (4 cores) — keep the request small.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef:
      group: enterpriseagentgateway.solo.io
      kind: EnterpriseAgentgatewayParameters
      name: agentgateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
