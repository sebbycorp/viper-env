# Internal chargeback for the self-hosted DGX Spark model: $0.10 per 1M tokens
# (input, output, reasoning). Loaded after model-costs, so it wins on any overlap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-costs
  namespace: agentgateway-system
data:
  catalog.json: |
    {
      "providers": {
        "openai": {
          "models": {
            "qwen3.8-flash-next": {
              "rates": { "input": "0.10", "output": "0.10", "reasoning": "0.10", "cacheRead": "0.10" },
              "tags": ["self-hosted", "dgx-spark"]
            },
            "Mia-AiLab/Qwen3.8-Flash-Next-NVFP4": {
              "rates": { "input": "0.10", "output": "0.10", "reasoning": "0.10", "cacheRead": "0.10" },
              "tags": ["self-hosted", "dgx-spark"]
            },
            "unsloth/Qwen3.8-27B-NVFP4": {
              "rates": { "input": "0.10", "output": "0.10", "reasoning": "0.10", "cacheRead": "0.10" },
              "tags": ["self-hosted", "dgx-spark"]
            }
          }
        }
      }
    }
