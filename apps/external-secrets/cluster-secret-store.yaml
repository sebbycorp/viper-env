# Template only. Auth uses the in-cluster ServiceAccount — no tokens in git.
# Create Vault role viper-eso and KV paths out-of-band before this will become Ready.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-lab
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: vault-lab
    app.kubernetes.io/part-of: viper-oss-env
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: https://vault.maniak.lab:8200
      # KV v2 mount. ExternalSecret remoteRef.key is relative to this mount
      # (Vault API path secret/data/lab/viper/...).
      path: secret
      version: v2
      # Uncomment if vault.maniak.lab uses a private CA.
      # Create ConfigMap vault-ca in namespace external-secrets out-of-band.
      # caProvider:
      #   type: ConfigMap
      #   namespace: external-secrets
      #   name: vault-ca
      #   key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          # Vault role name. Create it out-of-band; change this if yours differs.
          role: viper-eso
          # Vault 1.21+ may require a matching audience on the role.
          # audiences:
          #   - vault
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
