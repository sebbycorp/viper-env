# AppRole only. Omni's API proxy breaks Vault Kubernetes auth (TokenReview 403).
# Do not add kubernetes auth back.
#
# Bootstrap-only Secret `vault-approle` in namespace `external-secrets` must be
# created out-of-band with keys `role-id` and `secret-id`. NEVER commit that
# Secret or the AppRole credentials to git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-lab
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: vault-lab
    app.kubernetes.io/part-of: viper-oss-env
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      # Lab Vault speaks HTTP only. HTTPS clients fail with:
      #   http: server gave HTTP response to HTTPS client
      server: http://172.16.10.111:8200
      # KV v2 mount. ExternalSecret remoteRef.key is relative to this mount
      # (Vault API path secret/data/lab/viper/...).
      path: secret
      version: v2
      auth:
        appRole:
          path: approle
          roleRef:
            name: vault-approle
            namespace: external-secrets
            key: role-id
          secretRef:
            name: vault-approle
            namespace: external-secrets
            key: secret-id
