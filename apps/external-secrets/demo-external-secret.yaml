# Reads a non-sensitive demo key. The Vault object must be created out-of-band:
#   vault kv put secret/lab/viper/demo message=hello-from-vault
# Property is `message` (not `demo`). Do not put real credentials in this
# file or in Vault at this path if you treat the path as a public example.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-demo
  namespace: external-secrets
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: vault-demo
    app.kubernetes.io/part-of: viper-env
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-lab
    kind: ClusterSecretStore
  target:
    name: vault-demo
    creationPolicy: Owner
  data:
    - secretKey: message
      remoteRef:
        key: lab/viper/demo
        property: message
