# ClusterSecretStore + demo ExternalSecret. Syncs after the Helm operator
# Application (wave 0) so CRDs exist. SkipDryRun covers the first apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: external-secrets-config
    app.kubernetes.io/part-of: viper-oss-env
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@github.com:sebbycorp/viper-oss-env.git
    targetRevision: HEAD
    path: apps/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
