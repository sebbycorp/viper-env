# Agent Substrate Enterprise 0.5.0-alpha3-e492046 (release substrate, ns ate-system) — installed by Helm, not Argo CD.
# Native PodCertificate mode: Kubernetes 1.36 serves certificates.k8s.io/v1beta1 PodCertificateRequest + ClusterTrustBundle.
#   CH=oci://us-docker.pkg.dev/solo-public/enterprise-substrate-helm
#   helm upgrade --install substrate-crds    $CH/substrate-crds    --version 0.5.0-alpha3-e492046 -n ate-system
#   helm upgrade --install substrate-podcert $CH/substrate-podcert --version 0.5.0-alpha3-e492046 -n podcertificate-controller-system --create-namespace
#   helm upgrade --install substrate         $CH/substrate         --version 0.5.0-alpha3-e492046 -n ate-system \
#     -f docs/substrate-values.yaml --set-file global.licensing.licenseKey=<file with the agentgateway Enterprise license>
# Pre-created secrets (names only): ate-system/substrate-postgres-owner, ate-system/substrate-postgres-readwrite,
# ate-system/postgres-ca-pool (kubectl ate admin make-ca-pool). Postgres: in-cluster StatefulSet postgres/postgres
# (pgvector/pgvector:pg16, DBs kagent + substrate, password auth, no backups — lab grade).
usePodCertificateAPI: true
postgres:
  ownerRole: substrate_owner
  readWriteRole: substrate_readwrite
  schema: substrate
  clientCertificates:
    enabled: false
credentialProvider:
  namespacePolicies:
    - atespace: kagent
      allowedNamespaces: [kagent]
global:
  licensing:
    createSecret: true
    secretName: enterprise-agentgateway-license
