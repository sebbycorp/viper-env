apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omni-viper-root
  namespace: argocd
  labels:
    cluster: omni-viper
    app.kubernetes.io/name: omni-viper-root
    app.kubernetes.io/part-of: viper-env
spec:
  project: default
  source:
    # Private repo via read-only GitHub deploy key (title: argocd-omni-viper).
    # Register the SSH private key in Argo CD out-of-band. Never commit it.
    repoURL: git@github.com:sebbycorp/viper-env.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
