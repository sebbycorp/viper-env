# Solo Enterprise UI for agentgateway (management chart, release management →
# ns agentgateway-system). Rendered by Argo CD Application apps/management.yaml.
# License Secret management-license (key: license-key) comes from Vault via ESO.
# UI NodePort 30400 lives in apps/agentgateway-system/ui-nodeport.yaml; strategy maxSurge=0 because the single node
# cannot fit two UI pods during a rollout (see apps/management.yaml).
cluster: omni-viper
platform:
  multiCluster:
    enabled: false
istio:
  ambient:
    enabled: false
products:
  agentgateway:
    enabled: true
    namespace: agentgateway-system
    features:
      cost-management: true
      cost-management-writes: true
licensing:
  createSecret: false
  secretName: management-license
service:
  type: ClusterIP
  ui:
    # NodePort 30400 is pinned by apps/agentgateway-system/ui-nodeport.yaml.
    type: ClusterIP
clickhouse:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
      ephemeral-storage: 50Mi
    limits:
      cpu: 2
      memory: 4Gi
ui:
  backend:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
  frontend:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
telemetry:
  k8sobjects:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
  collector:
    resources:
      requests: {cpu: 100m, memory: 384Mi}
