# kagent Enterprise (release kagent-enterprise → ns kagent). Rendered by Argo CD
# Application apps/kagent-enterprise.yaml. Only Secret *names* appear here:
#   enterprise-kagent-license  ← apps/agentic-platform/licenses.yaml (Vault secret/lab/viper/licenses)
#   kagent-postgres-owner      ← apps/agentic-platform/postgres.yaml (Vault secret/lab/viper/postgres)
#   kagent-postgres-readwrite  ← apps/agentic-platform/postgres.yaml (Vault secret/lab/viper/postgres)
#   kagent-spark-openai        ← apps/agentic-platform/model-secrets.yaml
global:
  cluster: omni-viper
  istio:
    ambient:
      enabled: false
  licensing:
    createSecret: false
    secretName: enterprise-kagent-license
# --- Database: in-cluster Postgres (ns postgres, pgvector/pgvector:pg16), password auth ---
# Since 1.0.0-alpha11 the controller uses two connections: owner (migrations) and
# readWrite (every other query). Both Secrets hold the kagent_user login, which is a
# member of both roles; the controller SETs ROLE per connection. Prepare the database
# with both setup.sql scripts from solo-io/enterprise-kagent (see docs/kagent-substrate.md).
database:
  postgres:
    ownerConnectionStringSecretRef:
      name: kagent-postgres-owner
      key: ownerConnectionString
    readWriteConnectionStringSecretRef:
      name: kagent-postgres-readwrite
      key: readWriteConnectionString
    clientCertificate:
      enabled: false
config:
  database:
    owner:
      role: kagent_owner
    readWrite:
      role: kagent_readwrite
    schema: kagent
    vectorSchema: extensions
    vectorEnabled: true
    pool:
      maxConns: 20
      minConns: 2
      maxConnIdleTime: 1800s
      maxConnLifetime: 3600s
  logging:
    level: debug
  telemetry:
    traces:
      endpoint: http://solo-enterprise-telemetry-collector.kagent.svc.cluster.local:4317
  runtimeDefaults:
    telemetry:
      traces:
        endpoint: http://solo-enterprise-telemetry-collector.kagent.svc.cluster.local:4317
enterprise:
  database:
    postgres:
      schema: enterprise
  substrate:
    usePodCertificateAPI: true
# --- Agent Substrate (separate release `substrate` in ate-system) ---
controller:
  substrate:
    enabled: true
substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 3
  sandboxClass: gvisor
  workerImage: us-docker.pkg.dev/solo-public/substrate-enterprise/ateworker-gvisor:v0.6.0-b15382d4
# --- Default model: Spark Qwen (DGX Spark 172.16.10.173 via Service kagent/dgx-spark) ---
providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: qwen3.8-flash-next
    apiKeySecretRef: kagent-spark-openai
    apiKeySecretKey: OPENAI_API_KEY
    config:
      apiFormat: chatCompletions
      baseUrl: http://dgx-spark.kagent.svc.cluster.local:8000/v1
kagent-tools:
  enabled: true
grafana-mcp:
  enabled: false
oauth2-proxy:
  enabled: false
clickhouse:
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 250m
      ephemeral-storage: 50Mi
      memory: 1Gi
telemetry:
  enabled: true
  traces:
    enabled: true
    verbose: true
  selfMonitoring:
    enabled: true
    verbose: true
# UI Service stays ClusterIP; apps/kagent/ui-nodeport.yaml pins NodePort 30500
# (the chart cannot pin a nodePort). HTTPS 30501 is the hand-built nginx
# kagent-ui-tls front, which proxies to kagent-ui:8080 and is not in git.
ui:
  service:
    type: ClusterIP
    ports:
      port: 8080
      targetPort: 8080
